# Bambuddy + Portainer Agent on a Proxmox Docker VM.
# Data, logs and backups live on a Synology NAS (NFS, mounted by Docker).
# The database lives in PostgreSQL running on the Synology.
#
# Settings (NAS IP, database password, port, ...) come from a .env file next to
# this one. Copy .env.example to .env and fill it in; .env is not committed.
#
# Before first start:
#   1. On the VM:       curl -fsSL https://get.docker.com | sudo sh
#                       (Docker Engine + "docker compose" plugin)
#                       sudo apt install nfs-common
#   2. On the Synology: create <NFS_PATH>/{data,logs,backups} and an NFS
#                       permission rule for this VM's IP (sys, Squash "No mapping",
#                       "allow users to access mounted subfolders" ticked)
#   3. In pgAdmin:      CREATE USER bambuddy WITH PASSWORD '...';
#                       CREATE DATABASE bambuddy OWNER bambuddy;
#
# Deploy from the VM's shell (not as a Portainer stack, because the agent
# would be restarting itself):
#   sudo docker compose up -d
#
# If this VM already runs a Portainer Agent (e.g. from gitea-install),
# delete the portainer_agent service below — only one agent per Docker host.

services:
  bambuddy:
    image: ghcr.io/maziggy/bambuddy:latest
    container_name: bambuddy
    # Bind privileged ports 322/990 as non-root (FTPS + RTSPS for virtual printers)
    cap_add:
      - NET_BIND_SERVICE
    # Host mode so printer discovery (SSDP multicast) and camera streaming work
    network_mode: host
    volumes:
      - bambuddy_data:/app/data             # Synology: <NFS_PATH>/data
      - bambuddy_logs:/app/logs             # Synology: <NFS_PATH>/logs
      - bambuddy_backups:/app/data/backups  # Synology: <NFS_PATH>/backups
    environment:
      - TZ=${TZ:-America/New_York}
      # Container drops to this user after chowning /app/data and /app/logs
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - PORT=${PORT:-8000}
      # PostgreSQL on the Synology. DB_PASSWORD must be URL-encoded in .env
      # (e.g. @ → %40, ! → %21).
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-bambuddy}:${DB_PASSWORD}@${NAS_IP}:${DB_PORT:-5432}/${DB_NAME:-bambuddy}
    restart: unless-stopped
    stop_grace_period: 30s

  portainer_agent:
    image: portainer/agent:lts
    container_name: portainer_agent
    environment:
      - TZ=${TZ:-America/New_York}
    ports:
      - "9001:9001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
      - /:/host
    restart: always

volumes:
  bambuddy_data:
    driver: local
    driver_opts:
      type: nfs
      o: addr=${NAS_IP},nfsvers=4.1,rw,hard,noatime
      device: ":${NFS_PATH:-/volume1/docker/bambuddy}/data"
  bambuddy_logs:
    driver: local
    driver_opts:
      type: nfs
      o: addr=${NAS_IP},nfsvers=4.1,rw,hard,noatime
      device: ":${NFS_PATH:-/volume1/docker/bambuddy}/logs"
  bambuddy_backups:
    driver: local
    driver_opts:
      type: nfs
      o: addr=${NAS_IP},nfsvers=4.1,rw,hard,noatime
      device: ":${NFS_PATH:-/volume1/docker/bambuddy}/backups"
